<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d3d"><title>Dashboard | Tech Farm Sarnico</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef3f6;color:#10213b}.top{background:#071d3d;color:#fff;padding:24px 16px}.wrap{max-width:1180px;margin:auto}.brand{font-size:24px;font-weight:900}.brand b{color:#a7cf20}.sub{color:#c8d7e8;margin-top:6px}.main{padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{background:#fff;border-radius:16px;padding:16px}.n{font-size:30px;font-weight:950}.l{font-size:13px;color:#6b7785}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:0;border-radius:11px;padding:12px 15px;font:inherit;font-weight:850;background:#dce5ea;color:#10213b}.tab.active{background:#071d3d;color:#fff}.cards{display:grid;gap:12px}.card{background:#fff;border-radius:17px;padding:17px}.lead{border-left:5px solid #a7cf20}.row{display:flex;justify-content:space-between;gap:12px}.meta{font-size:13px;color:#71808f;line-height:1.5}.idea{margin:12px 0;line-height:1.45}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#edf3f6;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}.contactline{font-size:17px;margin:8px 0}.contactline a{color:#075ba8;font-weight:850}.empty,.error{background:white;border-radius:16px;padding:30px;text-align:center;color:#617080}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{display:block}.main{padding:11px}.tabs{display:grid;grid-template-columns:1fr 1fr}} </style></head><body><header class="top"><div class="wrap"><div class="brand">TECH <b>FARM</b> SARNICO</div><div class="sub">Dashboard campagna e persone interessate</div></div></header><main class="main"><div class="wrap"><section class="stats" id="stats"></section><div class="tabs"><button class="tab active" data-tab="idee">Preferenze</button><button class="tab" data-tab="contatti">Da ricontattare</button></div><section class="cards" id="cards"><div class="empty">Caricamento…</div></section></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";import{firebaseConfig}from"./firebase-config.js";const db=getDatabase(initializeApp(firebaseConfig));let idee=[],contatti=[],tab="idee";const $=x=>document.getElementById(x),cards=$("cards"),stats=$("stats"),labels={ai:"AI & Coding",robotica:"Robotica & Elettronica","3d":"3D & Maker",video:"Video & Digital",vr:"VR",green:"Green",altro:"Altro"};const esc=s=>String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[m]));const fmt=t=>t?new Intl.DateTimeFormat("it-IT",{dateStyle:"medium",timeStyle:"short"}).format(new Date(t)):"—";function drawStats(){const allInts=idee.flatMap(x=>x.interessi||[]);const top=Object.entries(labels).map(([k,v])=>[v,allInts.filter(i=>i===k).length]).sort((a,b)=>b[1]-a[1])[0];stats.innerHTML=`<div class="stat"><div class="n">${idee.length}</div><div class="l">Preferenze raccolte</div></div><div class="stat"><div class="n">${contatti.length}</div><div class="l">Da ricontattare</div></div><div class="stat"><div class="n">${new Set(idee.map(x=>x.zona).filter(Boolean)).size}</div><div class="l">Comuni / zone</div></div><div class="stat"><div class="n">${top&&top[1]?esc(top[0]):"—"}</div><div class="l">Ambito più votato</div></div>`}function chips(x){return(x.interessi||[]).map(v=>`<span class="chip">${esc(labels[v]||v)}</span>`).join("")}function render(){drawStats();if(tab==="contatti"){if(!contatti.length){cards.innerHTML='<div class="empty">Nessuna persona ha ancora chiesto di essere ricontattata.</div>';return}cards.innerHTML=contatti.map(x=>`<article class="card lead"><div class="row"><div><strong>${esc(x.nome||"Genitore/adulto")}</strong><div class="meta">Età ragazzo/a: ${esc(x.fasciaEta||"—")} · Zona: ${esc(x.zona||"—")}</div></div><div class="meta">${fmt(x.creatoIl)}</div></div>${x.telefono?`<div class="contactline">📱 <a href="tel:${esc(x.telefono)}">${esc(x.telefono)}</a></div>`:""}${x.email?`<div class="contactline">✉️ <a href="mailto:${esc(x.email)}">${esc(x.email)}</a></div>`:""}<div class="chips">${chips(x)}</div></article>`).join("");return}if(!idee.length){cards.innerHTML='<div class="empty">Nessuna preferenza ricevuta.</div>';return}cards.innerHTML=idee.map((x,i)=>`<article class="card"><div class="row"><div><strong>Preferenza #${idee.length-i}</strong><div class="meta">Età: ${esc(x.fasciaEta||"—")} · Zona: ${esc(x.zona||"—")}</div></div><div class="meta">${fmt(x.creatoIl)}<br>Provenienza: ${esc(x.campagna||"diretto")}</div></div>${x.idea?`<div class="idea">${esc(x.idea)}</div>`:""}<div class="chips">${chips(x)}</div></article>`).join("")}document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;render()});onValue(ref(db,"idee"),s=>{idee=Object.entries(s.val()||{}).map(([id,x])=>({id,...x})).sort((a,b)=>(b.creatoIl||0)-(a.creatoIl||0));render()},e=>{cards.innerHTML='<div class="error">Impossibile leggere il nodo idee dalle regole Firebase.</div>'});onValue(ref(db,"contatti"),s=>{contatti=Object.entries(s.val()||{}).map(([id,x])=>({id,...x})).sort((a,b)=>(b.creatoIl||0)-(a.creatoIl||0));render()},e=>{console.warn("contatti",e);render()});</script></body></html>
