<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#061b3a">
  <title>Tech Farm Sarnico</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #061b3a;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }
    a.poster-link {
      display: block;
      width: 100vw;
      max-width: 100%;
      text-decoration: none;
      line-height: 0;
    }
    img.poster {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
    }
    @media (min-width: 900px) {
      body {
        background: #061b3a;
      }
      a.poster-link {
        width: auto;
        max-width: min(100vw, 1024px);
      }
      img.poster {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <a class="poster-link"
     href="attrezzature.html"
     target="_blank"
     rel="noopener"
     aria-label="Apri l'elenco attrezzature Tech Farm">
    <img class="poster"
         src="locandina-tech-farm.png"
         alt="Tech Farm Sarnico - laboratorio di tecnologia, creatività e futuro per ragazzi">
  </a>
</body>
</html>
